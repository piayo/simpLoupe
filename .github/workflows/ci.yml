name: CI

on:
  # 全ブランチで走らせる。作業ブランチを push した時点で壊れていることに気づきたい
  # (main と PR だけだと、PR を作るまで一度も検証されない)。タグの push では走らせない
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同じ ref の古い実行は打ち切る。
# PR があると push と pull_request の両方が起きるので、無駄な二重実行もこれで吸収する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # i18n: キーの過不足・未定義キーの参照・生成物 (src/_locales/) のずれ
      - name: Check i18n
        run: npm run i18n:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Zip
        run: npm run zip

      # 生成物をダウンロードして動作確認できるようにする
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simploupe-dist
          path: zip/*.zip
          if-no-files-found: error
